[project]
name = "stacksmith-composer"
description = "A GitHub-connected visual composer for Stacksmith stacks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "ruamel.yaml>=0.18,<0.19",
  "jinja2>=3.1.6,<4",
  "itsdangerous>=2.2,<3",
  "cryptography>=44",
]
dynamic = ["version"]

[tool.poe]
include_script = "common_python_tasks:tasks(include_tags=[])"

[tool.poe.env]
CONTAINER_APT_PACKAGES = "git"
CONTAINER_CUSTOM_ENTRYPOINT = "stacksmith-composer"

[tool.poe.tasks]
api = "uvicorn stacksmith_composer.app:create_app --factory --reload --host 127.0.0.1 --port 8000"
web = "npm --prefix web run dev"

[project.scripts]
stacksmith-composer = "stacksmith_composer.__main__:main"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/stacksmith_composer"]

[tool.uv-dynamic-versioning]
style = "pep440"
dirty = true

[tool.uv]
package = true

[dependency-groups]
dev = [
  "common-python-tasks (>=0.12.1,<0.13.0)",
]

[build-system]
requires = ["hatchling>=1.27.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"
