[project]
name = "stacksmith-platform"
description = "A GitHub-connected authoring and execution platform for Stacksmith"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "ruamel.yaml>=0.18,<0.19",
  "jinja2>=3.1.6,<4",
  "itsdangerous>=2.2,<3",
  "cryptography>=44",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
  "pyjwt[crypto]>=2.10,<3",
  "docker>=7,<8",
  "kubernetes>=32,<36",
  "python-dotenv>=1,<2",
]
dynamic = ["version"]

[tool.poe]
include_script = "common_python_tasks:tasks(exclude_tags=['fastapi'])"

[tool.poe.env]
CONTAINER_APT_PACKAGES = "git"
CONTAINER_CUSTOM_ENTRYPOINT = "stacksmith-platform"
CONTAINER_EXTENSION_FILES = "deploy/platform.Dockerfile"
CONTAINER_DOCKERFILE_HOOK_PATH = "scripts/container_dockerfile.py"
CONTAINER_DOCKER_BUILD_ARGS = "--tag stacksmith-platform:local --build-arg NONROOT_UID=10001 --build-arg NONROOT_GID=10001"

[tool.poe.tasks]
configure = { script = "scripts.configure:main" }
compose-check = { script = "scripts.configure:check" }
execution-image = { script = "scripts.build_execution:main" }
compose-up = ["compose-check", "platform-image", "execution-image", "compose-start"]
kube-up = ["compose-check", "platform-image", "execution-image", "kube-start"]
kube-start = { script = "scripts.kubernetes:up" }
kube-forward = { script = "scripts.kubernetes:forward" }
compose-start = { script = "scripts.compose:start" }
compose-down = { script = "scripts.compose:down" }
compose-logs = { script = "scripts.compose:logs" }
test = { script = "scripts.run_tests:main" }
web-build = "npm --prefix web run build"
platform-image = ["build-image --single-arch"]


[project.scripts]
stacksmith-platform = "stacksmith_platform.__main__:main"
stacksmith-platform-supervise = "stacksmith_platform.supervision:supervise_main"
stacksmith-platform-maintain = "stacksmith_platform.supervision:maintain_main"
stacksmith-platform-worker = "stacksmith_platform.worker:main"
stacksmith-platform-execute = "stacksmith_platform.execution:main"
stacksmith-platform-init = "stacksmith_platform.admin:main"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/stacksmith_platform"]

[tool.uv-dynamic-versioning]
style = "pep440"
dirty = true

[tool.uv]
package = true

[dependency-groups]
dev = ["common-python-tasks (>=0.12.1,<0.13.0)"]

[build-system]
requires = ["hatchling>=1.27.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"
